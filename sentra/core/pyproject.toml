[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-core"
version = "1.0.0"
description = "SENTRA Central Cryptographic Gateway, PostgreSQL 16 Repository & MinIO Evidence Vault"
requires-python = ">=3.11"
dependencies = [
    "sentra-protocol>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "minio>=7.2.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.1.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sentra-core = "sentra_core.main:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentra_core*"]
